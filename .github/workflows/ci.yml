name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spirit
          POSTGRES_PASSWORD: spirit
          POSTGRES_DB: spirit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spirit -d spirit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://spirit:spirit@localhost:5432/spirit_test

    steps:
      - uses: actions/checkout@v4

      # Installs the pnpm version pinned in package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @spirit/api db:generate

      - name: Typecheck API
        run: pnpm --filter @spirit/api typecheck

      - name: Build all packages
        run: pnpm build

      - name: Run tests
        run: pnpm test
