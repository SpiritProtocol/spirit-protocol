services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: spirit
      POSTGRES_PASSWORD: spirit
      POSTGRES_DB: spirit_protocol
    ports:
      - "5433:5432"
    volumes:
      - spirit_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spirit -d spirit_protocol"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  spirit_postgres_data:
